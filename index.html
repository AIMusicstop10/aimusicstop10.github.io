​<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMusic's Top 10</title>
<style>
body {
margin: 0;
padding: 0;
background-color: #1a1a1a;
font-family: 'Arial', sans-serif;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
}
.jukebox-container {
width: 90%;
max-width: 400px;
background: linear-gradient(145deg, #2c2c2c, #111111);
border: 4px solid #00d4ff;
border-radius: 20px;
padding: 20px;
box-shadow: 0 0 25px #00d4ff;
text-align: center;
}
.header-title {
font-size: 24px;
font-weight: bold;
text-transform: uppercase;
letter-spacing: 2px;
margin-bottom: 20px;
padding: 10px;
background: #000000;
border-radius: 10px;
border: 2px solid #ff007f;
}
.brand-ai { color: #00d4ff; }
.brand-music { color: #ffffff; }
.brand-stop10 { color: #ff007f; }
.display-screen {
background-color: #051d24;
border: 2px solid #00d4ff;
border-radius: 10px;
height: 200px;
margin-bottom: 20px;
display: flex;
align-items: center;
justify-content: center;
color: #00d4ff;
font-family: 'Courier New', monospace;
box-shadow: inset 0 0 10px #00d4ff;
}
.button-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
margin-top: 10px;
}
.juke-btn {
background: #333;
border: 2px solid #ff007f;
color: #ff007f;
padding: 12px 0;
font-weight: bold;
border-radius: 5px;
cursor: pointer;
box-shadow: 0 0 5px #ff007f;
}
.juke-btn:active {
background: #ff007f;
color: #000;
}
</style>
</head>
<body>
​<div class="jukebox-container">
<div class="header-title">
<span class="brand-ai">AI</span><span class="brand-music">Music's</span> <span class="brand-stop10">Top 10</span>
</div>
​<div class="display-screen">
<div>[ Select a Track ]</div>
</div>
​<div class="button-grid">
<button class="juke-btn">1</button>
<button class="juke-btn">2</button>
<button class="juke-btn">3</button>
<button class="juke-btn">4</button>
<button class="juke-btn">5</button>
<button class="juke-btn">6</button>
<button class="juke-btn">7</button>
<button class="juke-btn">8</button>
<button class="juke-btn">9</button>
<button class="juke-btn">10</button>
<button class="juke-btn" style="grid-column: span 2; border-color: #00d4ff; color: #00d4ff; box-shadow: 0 0 5px #00d4ff;">PLAY</button>
</div>
</div>
​</body>
</html>

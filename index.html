<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AIMusic's Top 10 Jukebox</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#090909;
color:white;
min-height:100vh;
}

header{
text-align:center;
padding:25px;
background:#111;
border-bottom:2px solid #00d4ff;
}

header h1{
color:#00d4ff;
font-size:2.2rem;
}

.player{
max-width:900px;
margin:auto;
padding:20px;
}

.now-playing{
background:#161616;
padding:20px;
border-radius:15px;
margin-bottom:20px;
text-align:center;
}

#songTitle{
font-size:1.4rem;
color:#00d4ff;
margin-bottom:10px;
}

audio{
width:100%;
}

.controls{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-top:15px;
}

button{
background:#00d4ff;
color:black;
border:none;
padding:12px 18px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.8;
}

.search{
margin:20px 0;
}

.search input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
font-size:1rem;
}

.playlist{
background:#161616;
border-radius:15px;
overflow:hidden;
}

.song{
padding:15px;
border-bottom:1px solid #222;
cursor:pointer;
}

.song:hover{
background:#222;
}

.active{
background:#00d4ff;
color:black;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🎵 AIMusic's Top 10 Jukebox</h1>
<p>Original AI Music Collection</p>
</header>

<div class="player">

<div class="now-playing">
<div id="songTitle">Select A Song</div>

<audio id="audioPlayer" controls></audio>

<div class="controls">
<button onclick="previousSong()">⏮ Previous</button>
<button onclick="shuffleSongs()">🔀 Shuffle</button>
<button onclick="toggleRepeat()">🔁 Repeat</button>
<button onclick="nextSong()">⏭ Next</button>
</div>

<br>

<label>Volume</label>
<input type="range" min="0" max="1" step="0.01"
value="1"
oninput="audio.volume=this.value">

</div>

<div class="search">
<input type="text"
id="search"
placeholder="Search songs..."
onkeyup="filterSongs()">
</div>

<div class="playlist" id="playlist"></div>

</div>

<script>

const songs = [

"2026a.mp3",
"4love.mp3",
"Private Chef .mp3",
"Rights Go Quiet.mp3",
"Sassy Sophie.mp3",
"Suzanne.mp3",
"man matterv.mp3",
"prison burden1.mp3",
"LOOK AROUND (PSA).mp3",
"I don't hate you (Remix).mp3"

];

const audio =
document.getElementById("audioPlayer");

const playlist =
document.getElementById("playlist");

const title =
document.getElementById("songTitle");

let currentSong = 0;
let repeat = false;

function buildPlaylist(){

playlist.innerHTML="";

songs.forEach((song,index)=>{

const div =
document.createElement("div");

div.className="song";

div.innerHTML=song;

div.onclick=()=>playSong(index);

playlist.appendChild(div);

});

}

function playSong(index){

currentSong=index;

audio.src=songs[index];

audio.play();

title.innerHTML=songs[index];

updateActive();

}

function updateActive(){

document.querySelectorAll(".song")
.forEach((item,i)=>{

item.classList.toggle(
"active",
i===currentSong
);

});

}

function nextSong(){

currentSong++;

if(currentSong>=songs.length)
currentSong=0;

playSong(currentSong);

}

function previousSong(){

currentSong--;

if(currentSong<0)
currentSong=songs.length-1;

playSong(currentSong);

}

function shuffleSongs(){

songs.sort(()=>Math.random()-0.5);

buildPlaylist();

}

function toggleRepeat(){

repeat=!repeat;

alert(
repeat
? "Repeat On"
: "Repeat Off"
);

}

audio.addEventListener(
"ended",
()=>{
if(repeat){
playSong(currentSong);
}
else{
nextSong();
}
}
);

function filterSongs(){

const search =
document
.getElementById("search")
.value
.toLowerCase();

document
.querySelectorAll(".song")
.forEach(song=>{

song.style.display=
song.innerText
.toLowerCase()
.includes(search)
? "block"
: "none";

});

}

buildPlaylist();

</script>

</body>
</html>

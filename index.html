<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMusic's Top 10</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #030008;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Cyber Jukebox Console Main Body */
        .cyber-jukebox {
            width: 95%;
            max-width: 500px;
            background: #0d0614;
            border: 4px solid #4a154b;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(147, 51, 234, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.9);
            position: relative;
            box-sizing: border-box;
        }

        /* Neon Side Columns */
        .cyber-jukebox::before, .cyber-jukebox::after {
            content: '';
            position: absolute;
            top: 40px;
            width: 12px;
            height: calc(100% - 80px);
            border-radius: 6px;
        }
        /* Left Column Blue */
        .cyber-jukebox::before {
            left: -8px;
            background: #00d4ff;
            box-shadow: 0 0 15px #00d4ff;
        }
        /* Right Column Purple */
        .cyber-jukebox::after {
            right: -8px;
            background: #bd00ff;
            box-shadow: 0 0 15px #bd00ff;
        }

        /* Main Glowing Title Header */
        .header-panel {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #bd00ff;
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
        }

        .header-panel h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .header-panel span {
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }

        /* Vinyl Record Centerpiece Area */
        .record-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .vinyl-record {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #000 30%, #111 31%, #222 40%, #050505 50%, #1a1a1a 70%, #000 100%);
            border-radius: 50%;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(189, 0, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Center Gold Label */
        .record-label {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Sleek Status Display Screen */
        .status-display {
            background: #040206;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.3), 0 0 10px rgba(0, 212, 255, 0.1);
            margin-bottom: 25px;
        }

        .status-label {
            font-size: 11px;
            color: #00d4ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .status-text {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #ffffff;
        }

        /* Neon Track Selector Container */
        .tracks-container {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #4a154b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        .grid-title {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        /* High-tech Glowing Purple Grid Buttons */
        .cyber-btn {
            background: #140b24;
            border: 2px solid #bd00ff;
            color: #bd00ff;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(189, 0, 255, 0.3);
            transition: all 0.15s ease;
        }

        .cyber-btn:hover {
            background: rgba(189, 0, 255, 0.1);
            box-shadow: 0 0 12px rgba(189, 0, 255, 0.6);
        }

        .cyber-btn:active, .cyber-btn.active {
            background: #bd00ff;
            color: #000000;
            box-shadow: 0 0 15px #bd00ff;
            transform: scale(0.95);
        }

        /* Action Panel Buttons (Clear & Play) */
        .action-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .action-btn {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 14px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-clear {
            background: transparent;
            border: 2px solid #ff0055;
            color: #ff0055;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.2);
        }

        .btn-clear:active {
            background: #ff0055;
            color: #000;
            box-shadow: 0 0 15px #ff0055;
        }

        .btn-activate {
            background: transparent;
            border: 2px solid #00d4ff;
            color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
        }

        .btn-activate:active {
            background: #00d4ff;
            color: #000;
            box-shadow: 0 0 15px #00d4ff;
        }
    </style>
</head>
<body>

    <div class="cyber-jukebox">
        <div class="header-panel">
            <h1>AIMusic's <span>Top 10</span></h1>
        </div>
        
        <div class="record-zone">
            <div class="vinyl-record">
                <div class="record-label">TOP 10</div>
            </div>
        </div>

        <div class="status-display">
            <div class="status-label">System Status</div>
            <div id="display-text" class="status-text">READY TO LOAD TRAX</div>
        </div>

        <div class="tracks-container">
            <div class="grid-title">Select Track Number</div>
            <div class="button-grid">
                <button class="cyber-btn" onclick="selectTrack('1', this)">1</button>
                <button class="cyber-btn" onclick="selectTrack('2', this)">2</button>
                <button class="cyber-btn" onclick="selectTrack('3', this)">3</button>
                <button class="cyber-btn" onclick="selectTrack('4', this)">4</button>
                <button class="cyber-btn" onclick="selectTrack('5', this)">5</button>
                <button class="cyber-btn" onclick="selectTrack('6', this)">6</button>
                <button class="cyber-btn" onclick="selectTrack('7', this)">7</button>
                <button class="cyber-btn" onclick="selectTrack('8', this)">8</button>
                <button class="cyber-btn" onclick="selectTrack('9', this)">9</button>
                <button class="cyber-btn" onclick="selectTrack('10', this)">10</button>
            </div>

            <div class="action-panel">
                <button class="action-btn btn-clear" onclick="clearSystem()">Clear</button>
                <button class="action-btn btn-activate" onclick="fireTrack()">Play</button>
            </div>
        </div>
    </div>

    <script>
        let selectedTrackNum = "";

        function selectTrack(num, buttonElement) {
            let buttons = document.querySelectorAll('.cyber-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            buttonElement.classList.add('active');
            selectedTrackNum = num;
            document.getElementById('display-text').innerText = "TRACK " + num + " ARMED";
        }

        function clearSystem() {
            selectedTrackNum = "";
            let buttons = document.querySelectorAll('.cyber-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById('display-text').innerText = "READY TO LOAD TRAX";
        }

        function fireTrack() {
            if(selectedTrackNum === "") {
                document.getElementById('display-text').innerText = "SELECT TRACK FIRST";
            } else {
                document.getElementById('display-text').innerText = "NOW STREAMING: TRACK " + selectedTrackNum;
            }
        }
    </script>

</body>
</html>

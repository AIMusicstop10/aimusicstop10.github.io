<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM Music - Top 10 Countdown</title>
    <style>
        /* Base Page Styling */
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #1f2833;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
            border: 1px solid #333;
        }

        /* Header Styling */
        h1 {
            color: #fff;
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #66fcf1;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .instructions {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Audio Player Styling */
        .audio-player-container {
            width: 100%;
            margin-bottom: 25px;
            background: #151a21;
            padding: 10px;
            border-radius: 30px;
            box-sizing: border-box;
            border: 1px solid #007bff;
        }

        audio {
            width: 100%;
        }

        /* Playlist Stack Styling */
        .playlist {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Fixed Track Hotspot Classes */
        .track-hotspot {
            display: flex;
            align-items: center;
            background: #151a21;
            border: 1px solid #45f3ff33;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            color: inherit;
        }

        .track-hotspot:hover {
            background: #1f2833;
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
            transform: scale(1.01);
        }

        /* Active Track Glow */
        .track-hotspot.active {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            background: #1a242f;
        }

        .track-number { 
            font-weight: bold; 
            color: #007bff; 
            font-size: 1.2rem; 
            min-width: 35px; 
        } 

        .track-hotspot.active .track-number { 
            color: #00f2fe; 
            text-shadow: 0 0 8px #00f2fe;
        } 

        .track-details { 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1;
        } 

        .track-name { 
            font-weight: 600; 
            color: #fff;
            font-size: 1.05rem;
        } 

        .track-artist { 
            font-size: 0.85rem; 
            color: #888; 
            margin-top: 2px; 
        } 

        .play-icon { 
            font-size: 1.2rem; 
            color: #007bff; 
            margin-left: 10px;
        } 

        .track-hotspot.active .play-icon { 
            color: #00f2fe; 
        }
    </style>
</head>
<body>

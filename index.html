<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Musics Top 10</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0214;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container that maintains the aspect ratio of the main dashboard background */
        .dashboard-container {
            position: relative;
            width: 100%;
            max-width: 800px; 
            aspect-ratio: 10 / 16; 
            /* FIXED: Points to your new all-pink background image */
            background-image: url('Aimusics.png');
            background-size: cover;
            background-position: center;
            /* CHANGED: Neon pink glow shadows instead of blue */
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 127, 0.4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dark overlay to slightly dim the background so the front player pops out */
        .dashboard-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 2, 20, 0.3);
            border-radius: 12px;
            pointer-events: none;
        }

        /* The standalone song player layered on top */ 
        .song-player-front {
            position: relative;
            z-index: 10;
            width: 52%; 
            height: auto;
            aspect-ratio: 9 / 16; 
            /* Points to your uploaded vertical jukebox player */
            background-image: url('1781621075723.png');
            background-size: cover;
            background-position: center;
            /* CHANGED: Match the drop glow shadow to neon pink/magenta */
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.85)) 
                    drop-shadow(0 0 15px rgba(255, 0, 127, 0.4));
            transform: translateY(2%); 
            transition: transform 0.3s ease;
        }

        .song-player-front:hover {
            transform: translateY(2%) scale(1.02);
        }

        @media (min-height: 900px) and (min-width: 1024px) {
            .dashboard-container {
                max-width: 550px; 
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="dashboard-overlay"></div>
        <div class="song-player-front"></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Musics Top 10</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0214;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Dashboard Background Framework */
        .dashboard-container {
            position: relative;
            width: 100%;
            max-width: 800px; 
            aspect-ratio: 10 / 16; 
            background-image: url('1781621044747.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 127, 0.4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 2, 20, 0.3);
            border-radius: 12px;
            pointer-events: none;
        }

        /* Front Jukebox Player */
        .song-player-front {
            position: relative;
            z-index: 10;
            width: 52%; 
            height: auto;
            aspect-ratio: 9 / 16; 
            background-image: url('1781621075723.png');
            background-size: cover;
            background-position: center;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.85)) 
                    drop-shadow(0 0 15px rgba(255, 0, 127, 0.4));
            transform: translateY(2%); 
            transition: transform 0.3s ease;
        }

        /* Invisible grid layer matching slots 1-10 on the artwork */
        .playlist-overlay-grid {
            position: absolute;
            top: 31%;     
            left: 5%;
            width: 90%;
            height: 42%;   
            display: grid;
            grid-template-columns: 1fr 1fr; /* Left column (1-5), Right column (6-10) */
            grid-template-rows: repeat(5, 1fr);
            gap: 4px;
        }

        /* Invisible click targets over song titles */
        .track-hotspot {
            background: rgba(255, 255, 255, 0); 
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        /* Hot pink neon response when hovering or playing */
        .track-hotspot:hover {
            background: rgba(255, 0, 127, 0.15);
        }
        
        .track-hotspot.playing {
            background: rgba(255, 0, 127, 0.25);
            box-shadow: inset 0 0 8px rgba(255, 0, 127, 0.6);
        }

        @media (min-height: 900px) and (min-width: 1024px) {
            .dashboard-container {
                max-width: 550px; 
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="dashboard-overlay"></div>
        
        <div class="song-player-front">
            <div class="playlist-overlay-grid">
                <button class="track-hotspot" onclick="playSong('2026a.mp3', this)" title="Play Track 1"></button>
                <button class="track-hotspot" onclick="playSong('4love.mp3', this)" title="Play Track 2"></button>
                <button class="track-hotspot" onclick="playSong('Sassy Sophie.mp3', this)" title="Play Track 3"></button>
                <button class="track-hotspot" onclick="playSong('Rights Go Quiet.mp3', this)" title="Play Track 4"></button>
                <button class="track-hotspot" onclick="playSong('Suzanne.mp3', this)" title="Play Track 5"></button>
                
                <button class="track-hotspot" onclick="playSong('Private Chef .mp3', this)" title="Play Track 6"></button>
                <button class="track-hotspot" onclick="playSong('man matterv.mp3', this)" title="Play Track 7"></button>
                <button class="track-hotspot" onclick="playSong('love......mp3', this)" title="Play Track 8"></button>
                <button class="track-hotspot" onclick="playSong('same breath life is death..mp3', this)" title="Play Track 9"></button>
                <button class="track-hotspot" onclick="playSong('shanes fame.mp3', this)" title="Play Track 10"></button>
            </div>
        </div>
    </div>

    <audio id="global-audio-player"></audio>

    <script>
        const audioPlayer = document.getElementById('global-audio-player');
        let currentButton = null;

        function playSong(audioFile, element) {
            // Pause if clicking an already active song
            if (audioPlayer.src.includes(encodeURIComponent(audioFile)) && !audioPlayer.paused) {
                audioPlayer.pause();
                element.classList.remove('playing');
                return;
            }

            // Reset glow state on previous track
            if (currentButton) {
                currentButton.classList.remove('playing');
            }

            // Assign audio source and play
            audioPlayer.src = audioFile;
            audioPlayer.play().catch(error => console.log("Playback error or file missing:", error));
            
            currentButton = element;
            currentButton.classList.add('playing');
        }

        // Clean up glow style when audio finishes automatically
        audioPlayer.onended = function() {
            if (currentButton) {
                currentButton.classList.remove('playing');
            }
        };
    </script>

</body>
</html>

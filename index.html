<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM Music - Top 10 Countdown</title>
    <style>
        :root {
            --bg-color: #09090e;
            --panel-color: #13131f;
            --accent-cyan: #00f2fe;
            --accent-blue: #007bff;
            --fav-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Brand Headers matching your layout */
        .brand-header {
            font-size: 2.5rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
        }

        /* Modern Jukebox Plate Container */
        .player-container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-sizing: border-box;
        }

        /* Active Display Panel */
        .now-playing-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Hidden or Styled Audio Player Engine */
        audio {
            width: 100%;
            margin-bottom: 20px;
            outline: none;
        }

        /* Custom Audio Control Row */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            color: var(--accent-cyan);
            text-shadow: 0 0 8px var(--accent-cyan);
            transform: scale(1.1);
        }

        .btn-play-pause {
            font-size: 2.3rem;
            color: var(--accent-cyan);
        }

        .btn-fav-toggle.active {
            color: var(--fav-pink);
            text-shadow: 0 0 8px var(--fav-pink);
        }

        /* Countdown Playlist Section */
        .playlist-section-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .track-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 280px;
            overflow-y: auto;
        }

        /* Custom Track Layout matching your screenshot styles */
        .track-hotspot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .track-hotspot:hover {
            background: rgba(0, 123, 255, 0.08);
            border-left-color: var(--accent-blue);
        }

        .track-hotspot.active {
            background: rgba(0, 242, 254, 0.08);
            border-left-color: var(--accent-cyan);
        }

        .left-details-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .track-number {
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 1.2rem;
            min-width: 25px;
        }

        .track-hotspot.active .track-number {
            color: var(--accent-cyan);
            text-shadow: 0 0 5px var(--accent-cyan);
        }

        .track-details {
            display: flex;
            flex-direction: column;
        }

        .track-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .track-artist {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .right-actions-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-icon {
            font-size: 1.2rem;
            color: var(--accent-blue);
        }

        .track-hotspot.active .play-icon {
            color: var(--accent-cyan);
        }

        .fav-star {
            color: rgba(255, 255, 255, 0.1);
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .fav-star.active {
            color: var(--fav-pink);
            text-shadow: 0 0 5px var(--fav-pink);
        }

        /* Scrollbar aesthetics */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    </style>
</head>
<body>

    <h1 class="brand-header">AIM Music</h1>
    <div class="subtitle">Top 10 Countdown</div>

    <div class="player-container">
        
        <div class="now-playing-title" id="player-title">Select a Track to Play</div>

        <audio id="main-audio"></audio>

        <div class="controls-row">
            <button class="btn btn-fav-toggle" id="global-fav-btn" title="Save to Personal Folder">♥</button>
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn btn-play-pause" id="play-btn">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <div class="playlist-section-header">
            <span>Chart Ranking</span>
            <span>Folder</span>
        </div>
        
        <ul class="track-list" id="jukebox-playlist">
            </ul>
    </div>

<script>
    // 1. TOP 10 INVENTORY - Swap out URLs with your actual track links
    const topTenTracks = [
        { position: "01", title: "Neon Energy", artist: "AI Producer One", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { position: "02", title: "Cyber Streets", artist: "AI Producer Two", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { position: "03", title: "Future Rhythm", artist: "Digital Architect", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
        { position: "04", title: "Velocity Rap", artist: "Vocal Synthesizer", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
        { position: "05", title: "Midnight Drive", artist: "Retro Wave City", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
        { position: "06", title: "Deep Bassline", artist: "Sub-Woof Frequency", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" },
        { position: "07", title: "Cloud Nine", artist: "Ambient Dreamer", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" },
        { position: "08", title: "Glitch Hop", artist: "The Broken Code", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" },
        { position: "09", title: "Synth Sonata", artist: "Classical Electric", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" },
        { position: "10", title: "Final Frontier", artist: "Cosmic Audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" }
    ];

    // 2. Personal Folder / Local Storage Core Logic
    let userSavedFolder = JSON.parse(localStorage.getItem('aim_user_favorites')) || [];

    // System Connections
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const globalFavBtn = document.getElementById('global-fav-btn');
    const playerTitle = document.getElementById('player-title');
    const playlistContainer = document.getElementById('jukebox-playlist');

    let currentTrackIndex = -1;
    let isPlaying = false;

    // Load active track information into engine
    function loadTrack(index) {
        if (index < 0 || index >= topTenTracks.length) return;
        currentTrackIndex = index;
        const track = topTenTracks[index];
        
        audio.src = track.url;
        playerTitle.textContent = `${track.title} - ${track.artist}`;
        
        updateVisualStates();
    }

    // Play and Pause Trigger Mechanism
    function togglePlayback() {
        if (currentTrackIndex === -1) {
            loadTrack(0); // Default load track 1 if nothing is selected
        }

        if (isPlaying) {
            audio.pause();
            playBtn.textContent = "▶";
        } else {
            audio.play().catch(err => console.log("Audio device ignition requires user engagement context."));
            playBtn.textContent = "⏸";
        }
        isPlaying = !isPlaying;
        updateVisualStates();
    }

    // Skip Buttons Logic
    function handleTrackSkip(offset) {
        let targetIndex = currentTrackIndex + offset;
        if (targetIndex >= topTenTracks.length) targetIndex = 0;
        if (targetIndex < 0) targetIndex = topTenTracks.length - 1;
        
        loadTrack(targetIndex);
        if (isPlaying) {
            audio.play();
        } else {
            togglePlayback();
        }
    }

    // Personal Folder Save System
    function toggleTrackToFolder(trackTitleString) {
        if (userSavedFolder.includes(trackTitleString)) {
            userSavedFolder = userSavedFolder.filter(title => title !== trackTitleString);
        } else {
            userSavedFolder.push(trackTitleString);
        }
        localStorage.setItem('aim_user_favorites', JSON.stringify(userSavedFolder));
        updateVisualStates();
    }

    // Render the layout rows to browser screen
    function renderJukeboxInterface() {
        playlistContainer.innerHTML = "";
        
        topTenTracks.forEach((track, index) => {
            const isFavorite = userSavedFolder.includes(track.title);
            const li = document.createElement('li');
            li.className = `track-hotspot ${index === currentTrackIndex ? 'active' : ''}`;
            li.setAttribute('data-index', index);
            
            li.innerHTML = `
                <div class="left-details-block">
                    <span class="track-number">${track.position}</span>
                    <div class="track-details">
                        <span class="track-name">${track.title}</span>
                        <span class="track-artist">${track.artist}</span>
                    </div>
                </div>
                <div class="right-actions-block">
                    <span class="play-icon">▶</span>
                    <span class="fav-star ${isFavorite ? 'active' : ''}">♥</span>
                </div>
            `;

            // Click row to play track handler
            li.addEventListener('click', (e) => {
                // If user clicks the favorite icon star specifically
                if (e.target.classList.contains('fav-star')) {
                    e.stopPropagation();
                    toggleTrackToFolder(track.title);
                    return;
                }
                
                loadTrack(index);
                isPlaying = false; 
                togglePlayback();
            });

            playlistContainer.appendChild(li);
        });
    }

    // Dynamically adjust neon visual highlights on click updates
    function updateVisualStates() {
        // Update Playlist Row styling loops
        const rows = playlistContainer.querySelectorAll('.track-hotspot');
        rows.forEach((row, index) => {
            const track = topTenTracks[index];
            const isFavorite = userSavedFolder.includes(track.title);
            const star = row.querySelector('.fav-star');

            if (index === currentTrackIndex) {
                row.classList.add('active');
                row.querySelector('.play-icon').textContent = isPlaying ? "⏸" : "▶";
            } else {
                row.classList.remove('active');
                row.querySelector('.play-icon').textContent = "▶";
            }

            if (isFavorite) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });

        // Update Global Main Action Bar buttons styling
        if (currentTrackIndex !== -1) {
            const activeTrack = topTenTracks[currentTrackIndex];
            if (userSavedFolder.includes(activeTrack.title)) {
                globalFavBtn.classList.add('active');
            } else {
                globalFavBtn.classList.remove('active');
            }
        }
    }

    // Set up Main Hardware Interface Listeners
    playBtn.addEventListener('click', togglePlayback);
    prevBtn.addEventListener('click', () => handleTrackSkip(-1));
    nextBtn.addEventListener('click', () => handleTrackSkip(1));
    
    globalFavBtn.addEventListener('click', () => {
        if (currentTrackIndex !== -1) {
            toggleTrackToFolder(topTenTracks[currentTrackIndex].title);
        }
    });

    // Automatically change to next song if active song finishes playing completely
    audio.addEventListener('ended', () => handleTrackSkip(1));

    // Initialize layout setup rules on startup window configuration
    renderJukeboxInterface();
</script>

</body>
</html>
